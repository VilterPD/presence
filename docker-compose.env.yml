# docker-compose.env.yml
# Uses a .env file (recommended). Put *all* values in .env and keep this file generic.

services:
  presence:
    container_name: presence
    image: vilter/presence:latest
    restart: unless-stopped

    environment:
      # =========================
      # Core
      # =========================
      ROLE: ${ROLE:-primary}
      DB_PATH: ${DB_PATH:-/data/presence.db}
      INIT_DB: ${INIT_DB:-1}

      # =========================
      # Absence (Hawk)
      # =========================
      ABSENCE_BASE_URL: ${ABSENCE_BASE_URL:-https://app.absence.io}
      ABSENCE_API_ID: ${ABSENCE_API_ID:-}
      ABSENCE_API_KEY: ${ABSENCE_API_KEY:-}

      # =========================
      # 3CX (OAuth service principal)
      # =========================
      THREECX_PBX_FQDN: ${THREECX_PBX_FQDN:-}
      THREECX_CLIENT_ID: ${THREECX_CLIENT_ID:-}
      THREECX_CLIENT_SECRET: ${THREECX_CLIENT_SECRET:-}

      # =========================
      # Profiles
      # =========================
      THREECX_PROFILE_AVAILABLE: ${THREECX_PROFILE_AVAILABLE:-Available}
      THREECX_PROFILE_AWAY: ${THREECX_PROFILE_AWAY:-Away}

      # =========================
      # Polling / behaviour
      # =========================
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      DAY_START_HOUR: ${DAY_START_HOUR:-7}
      DAY_END_HOUR: ${DAY_END_HOUR:-20}
      INTERVAL_DAY_SECONDS: ${INTERVAL_DAY_SECONDS:-60}
      INTERVAL_NIGHT_SECONDS: ${INTERVAL_NIGHT_SECONDS:-600}

      # =========================
      # Exclusions
      # =========================
      EXCLUDE_EMAILS: ${EXCLUDE_EMAILS:-}
      EXCLUDE_EXTENSIONS: ${EXCLUDE_EXTENSIONS:-}

      # =========================
      # Health / failover (watcher.py)
      # =========================
      # On primary:
      #   leave PRIMARY_HOST empty
      # On backup:
      #   set PRIMARY_HOST to the primary's IP/DNS (e.g. Tailscale IP)
      PRIMARY_HOST: ${PRIMARY_HOST:-}
      HEALTH_PORT: ${HEALTH_PORT:-49317}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-10}
      FAILOVER_AFTER: ${FAILOVER_AFTER:-60}
      FAILBACK_AFTER: ${FAILBACK_AFTER:-600}

      # =========================
      # Debug / safety
      # =========================
      SYNC_DRY_RUN: ${SYNC_DRY_RUN:-false}

    volumes:
      - presence-data:/data

    # Only publish the health port if the *other node* must reach it over the network.
    # Typically: enable this on PRIMARY, optional on BACKUP.
    ports:
      - "${HEALTH_PORT:-49317}:${HEALTH_PORT:-49317}"

volumes:
  presence-data:
